<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Fichas - {{ sala["nome"] }}</title>
</head>

<body>

    <h1>Fichas dos jogadores</h1>

    <hr>

    {% for jogador in jogadores %}

        <div>

            <h2>
                {{ jogador["nome_jogador"] }}
            </h2>

            {% if jogador["ficha_id"] %}

                <p>
                    Personagem:
                    {{ jogador["nome_personagem"] }}
                </p>

                <form method="POST" action="/editar-ficha">

                    <!-- Identifica qual ficha estamos editando -->
                    <input
                        type="hidden"
                        name="ficha_id"
                        value="{{ jogador['ficha_id'] }}"
                    >

                    <label>
                        Vida:
                    </label>

                    <input
                        type="number"
                        name="vida"
                        value="{{ jogador['vida'] }}"
                    >

                    <br><br>

                    <label>
                        Ataque:
                    </label>

                    <input
                        type="number"
                        name="ataque"
                        value="{{ jogador['ataque'] }}"
                    >

                    <br><br>

                    <label>
                        Defesa:
                    </label>

                    <input
                        type="number"
                        name="defesa"
                        value="{{ jogador['defesa'] }}"
                    >

                    <br><br>

                    <button type="submit">
                        Salvar alterações
                    </button>

                </form>

            {% else %}

                <p>
                    Este jogador ainda não possui uma ficha.
                </p>

            {% endif %}

        </div>

        <hr>

    {% endfor %}

</body>

</html>
